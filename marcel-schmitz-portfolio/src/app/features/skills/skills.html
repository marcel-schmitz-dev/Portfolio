<section id="skills" class="skills-section">
  <div class="skills-container">
    <h2 class="skills-title">{{ t.title }}</h2>

    <div class="skills-content-wrapper">
      <div class="skills-grid">
        @for (skill of skillList; track skill.name) {
          <div class="skill-card">
            <div class="icon-wrapper">
              <img [src]="skill.icon" [alt]="skill.name" class="skill-icon" />
            </div>
          </div>
        }
      </div>

      <div class="skills-learning-circle">
        <div class="learning-content">
          <h3 class="learning-title">{{ t.learningTitle }}</h3>
          <div class="learning-icons">
            @for (item of learningList; track item.name) {
              <div class="learning-item">
                <div class="icon-wrapper">
                  <img [src]="item.icon" [alt]="item.name" class="skill-icon" />
                </div>
              </div>
            }
          </div>
          <p class="learning-text">{{ t.learningText }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
