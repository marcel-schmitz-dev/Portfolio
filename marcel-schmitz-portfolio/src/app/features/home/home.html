<main class="home">
  <section class="hero" id="home">
    <!-- Mobiler Header (wird nur <= 900px angezeigt) -->
    <div class="hero__mobile-header">
      <div class="hero__top-logo-block">
        <img src="./assets/logo.png" alt="Logo" class="hero__top-logo-img" />
        <div class="hero__top-logo-text">
          <span class="name-anta">M.Schmitz</span>
          <span class="dev-josefin">developer</span>
        </div>
      </div>

      <!-- Burger / X Menü Button -->
      <button
        class="hero__burger-btn"
        (click)="toggleMenu()"
        [class.is-open]="isMenuOpen"
        aria-label="Menu"
      >
        <span class="burger-line"></span>
        <span class="burger-line"></span>
        <span class="burger-line"></span>
      </button>
    </div>

    <!-- Desktop Logo (wird bei Mobile ausgeblendet) -->
    <div class="hero__top-logo-block desktop-only">
      <img src="./assets/logo.png" alt="Logo" class="hero__top-logo-img" />
      <div class="hero__top-logo-text">
        <span class="name-anta">M.Schmitz</span>
        <span class="dev-josefin">developer</span>
      </div>
    </div>

    <!-- Desktop Socials (wird bei Mobile ausgeblendet) -->
    <div class="hero__socials-vertical desktop-only">
      <a href="mailto:m.schmitz.dev@gmail.com" aria-label="Email" class="social-link">
        <img src="./assets/Mail-def.webp" alt="Email" class="social-img social-default" />
        <img src="./assets/email-hover.png" alt="Email Hover" class="social-img social-hover" />
      </a>
      <a
        href="https://github.com/marcel-schmitz-dev"
        target="_blank"
        aria-label="GitHub"
        class="social-link"
      >
        <img src="./assets/Github-button.webp" alt="GitHub" class="social-img social-default" />
        <img src="./assets/git-hover.png" alt="GitHub Hover" class="social-img social-hover" />
      </a>
      <a
        href="https://linkedin.com/in/dein-linkedin"
        target="_blank"
        aria-label="LinkedIn"
        class="social-link"
      >
        <img src="./assets/Linkedin-button.webp" alt="LinkedIn" class="social-img social-default" />
        <img
          src="./assets/linkdin-hover.png"
          alt="LinkedIn Hover"
          class="social-img social-hover"
        />
      </a>
    </div>

    <!-- Mobile Overlay Menü -->
    <div class="mobile-menu-overlay" [class.is-open]="isMenuOpen">
      <nav class="mobile-menu-nav">
        <a (click)="scrollToSection('why-me')">{{ t.whyMe }}</a>
        <a (click)="scrollToSection('skills')">{{ t.skills }}</a>
        <a (click)="scrollToSection('projects')">{{ t.projects }}</a>
        <a (click)="scrollToSection('contact')">{{ t.contact }}</a>

        <div class="mobile-language-switch">
          <span [class.active]="currentLang === 'de'" (click)="switchLang('de')">DE</span>
          <span class="separator">/</span>
          <span [class.active]="currentLang === 'en'" (click)="switchLang('en')">EN</span>
        </div>
      </nav>
    </div>

    <div class="hero__container">
      <div class="hero__image-col">
        <div class="hero__blob-box">
          <img src="./assets/hero-blob-default.webp" alt="" class="hero__blob blob-default" />
          <img src="./assets/hero-blob-hover.webp" alt="" class="hero__blob blob-hover" />
          <img src="./assets/Profil.webp" alt="Marcel Schmitz" class="hero__avatar" />
        </div>
      </div>

      <div class="hero__text-col">
        <h1 class="hero__title">Marcel Schmitz</h1>
        <p class="hero__subtitle">{{ t.subtitle }}</p>
      </div>
    </div>

    <a href="#why-me" class="hero__scroll" aria-label="Nach unten scrollen">
      <img src="./assets/ArrowDefault.png" alt="" class="arrow-img arrow-default" />
      <img src="./assets/ArrowHover.png" alt="" class="arrow-img arrow-hover" />
    </a>
  </section>

  <app-header [currentLang]="currentLang" [t]="t" (langChange)="toggleLanguage()"> </app-header>
  <app-why-me [lang]="currentLang" />
  <app-skills [lang]="currentLang" />
  <app-projects [lang]="currentLang" />
  <app-contact-me [lang]="currentLang" />
  <app-footer [lang]="currentLang"></app-footer>
</main>
