<footer class="footer">
  <div class="footer__container">
    <div class="footer__left">
      <a routerLink="/legal-notice" class="footer__legal-link">{{ t.legalNotice }}</a>
      <p class="footer__copyright">{{ t.copyright }}</p>
    </div>

    <div class="footer__center">
      <a href="#home" class="footer__logo-link">
        <img
          src="./assets/footer/footer-logo.png"
          alt="M.Schmitz Developer Logo"
          class="footer__logo"
        />
        <div class="footer__logo-text">
          <span class="footer-name-anta">M.Schmitz</span>
          <span class="footer-dev-josefin">developer</span>
        </div>
      </a>
    </div>

    <div class="footer__right">
      <a
        href="https://github.com/marcel-schmitz-dev"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="GitHub"
        class="footer__social-link"
      >
        <img
          src="./assets/footer/github-icon.png"
          alt="GitHub"
          class="footer__social-img footer__social-default"
        />
        <img
          src="./assets/footer/github-hover.png"
          alt="GitHub Hover"
          class="footer__social-img footer__social-hover"
        />
      </a>

      <a href="mailto:m.schmitz.dev@gmail.com" aria-label="Email" class="footer__social-link">
        <img
          src="./assets/footer/email-icon.png"
          alt="Email"
          class="footer__social-img footer__social-default"
        />
        <img
          src="./assets/footer/email-hover.png"
          alt="Email Hover"
          class="footer__social-img footer__social-hover"
        />
      </a>

      <a
        href="https://linkedin.com"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="LinkedIn"
        class="footer__social-link"
      >
        <img
          src="./assets/footer/linkdin-icon.png"
          alt="LinkedIn"
          class="footer__social-img footer__social-default"
        />
        <img
          src="./assets/footer/linkdin-hover.png"
          alt="LinkedIn Hover"
          class="footer__social-img footer__social-hover"
        />
      </a>
    </div>
  </div>
</footer>
